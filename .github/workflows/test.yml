name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15
      - run: node scripts/check-shared.mjs
  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [eve-agent, eve-agent-agentmail, crm-direct]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15
          cache: npm
          cache-dependency-path: ${{ matrix.example }}/package-lock.json
      - run: npm ci
      - run: npm test
