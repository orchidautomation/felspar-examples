name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15
      # Each example installs on its own, exactly as someone copying it would.
      - run: for example in eve-agent eve-agent-agentmail no-agent crm-and-agent; do (cd "$example" && npm ci); done
      - run: for script in no-agent/decide.mjs crm-and-agent/decide.mjs crm-and-agent/verify.mjs crm-and-agent/cases.mjs claude-code-hooks/.claude/hooks/felspar-hook.mjs claude-code-hooks/.claude/hooks/change-record.mjs claude-code-hooks/dry-run.mjs; do node --check "$script"; done
      - run: npm ci
      - run: npm test
      - run: npm run test --prefix eve-agent-agentmail
      - run: npm test --prefix claude-code-hooks
      # The Python example installs its pinned package on its own, the same way.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
        working-directory: no-agent-python
      - run: .venv/bin/python -m py_compile decide.py
        working-directory: no-agent-python
      - run: .venv/bin/python -c "from felspar import Client; from felspar.generated.api.agents import decide_job, describe_job; from felspar.generated.models.decision_input_any_of_variant_0 import DecisionInputAnyOfVariant0"
        working-directory: no-agent-python
