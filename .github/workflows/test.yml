name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15
      # Each example installs on its own, exactly as someone copying it would.
      - run: for example in eve-agent eve-agent-agentmail no-agent crm-and-agent; do (cd "$example" && npm ci); done
      - run: for script in no-agent/decide.mjs crm-and-agent/decide.mjs crm-and-agent/verify.mjs crm-and-agent/cases.mjs; do node --check "$script"; done
      - run: npm ci
      - run: npm test
